// One-off init script: resolve :connect:runtime runtimeClasspath and list external modules.
gradle.projectsLoaded {
    def connectRuntime = rootProject.findProject(':connect:runtime')
    if (connectRuntime == null) {
        return
    }
    connectRuntime.afterEvaluate { project ->
        project.tasks.register('listExternalRuntimeClasspathLibs') {
            group = 'help'
            description = 'Writes external runtimeClasspath libraries to a file'
            doLast {
                def outFile = project.file('runtimeClasspath-external-libraries.txt')
                def config = project.configurations.named('runtimeClasspath').get()
                config.resolve()

                def coordinates = new TreeSet<String>()
                config.incoming.resolutionResult.allComponents.each { component ->
                    def id = component.id
                    if (id instanceof ModuleComponentIdentifier) {
                        coordinates << "${id.group}:${id.module}:${id.version}"
                    }
                }

                outFile.text = coordinates.join('\n') + (coordinates.isEmpty() ? '' : '\n')
                logger.lifecycle("Wrote ${coordinates.size()} external libraries to ${outFile}")
            }
        }
    }
}
